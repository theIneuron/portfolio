<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boyazid — демонстрационные учебные макеты</title>
    <style>
      :root {
        --ink: #10192b;
        --muted: #66738a;
        --line: #dfe5ef;
        --violet: #6555ee;
        --violet-soft: #eeebff;
        --cyan: #0d9f99;
        --cyan-soft: #e1f7f4;
        --amber: #ca8214;
        --amber-soft: #fff2d6;
      }
      * { box-sizing: border-box; }
      html, body { width: 900px; height: 1273px; margin: 0; overflow: hidden; }
      body {
        background: #fff;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        position: relative;
        width: 900px;
        height: 1273px;
        overflow: hidden;
        background:
          radial-gradient(circle at 92% 8%, rgba(101,85,238,.08), transparent 24%),
          linear-gradient(#fff, #fff);
        padding: 62px 66px 55px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(62,75,103,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(62,75,103,.035) 1px, transparent 1px);
        background-size: 31px 31px;
        mask-image: linear-gradient(to bottom, #000, transparent 43%);
        pointer-events: none;
      }
      .watermarks {
        position: absolute;
        inset: -120px;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        align-content: space-around;
        justify-items: center;
        gap: 125px 30px;
        transform: rotate(-28deg);
        pointer-events: none;
      }
      .watermarks span {
        color: var(--ink);
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .18em;
        opacity: .055;
        white-space: nowrap;
      }
      header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 13px;
        background: linear-gradient(145deg, #7768f6, #5141db);
        color: #fff;
        font-size: 17px;
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(101,85,238,.22);
      }
      .brand strong { display: block; font-size: 14px; }
      .brand small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .demo-badge {
        border: 1px solid rgba(101,85,238,.25);
        border-radius: 999px;
        background: var(--violet-soft);
        color: #5848d8;
        padding: 9px 13px;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: .09em;
        text-transform: uppercase;
      }
      main { position: relative; z-index: 2; }
      .kicker {
        margin: 43px 0 14px;
        color: var(--accent, var(--violet));
        font-size: 10px;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 715px;
        margin: 0;
        font-size: 42px;
        line-height: 1.08;
        letter-spacing: -.04em;
      }
      .lead {
        max-width: 690px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 26px;
      }
      .meta > div {
        min-height: 74px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255,255,255,.78);
        padding: 14px;
      }
      .meta span {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      .meta strong { font-size: 12px; line-height: 1.4; }
      .section {
        margin-top: 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255,255,255,.9);
        padding: 20px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .section-title h2 { margin: 0; font-size: 18px; }
      .section-title span {
        color: var(--accent, var(--violet));
        font-size: 9px;
        font-weight: 900;
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .goal {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        border-radius: 12px;
        background: var(--soft, var(--violet-soft));
        padding: 13px;
      }
      .goal b {
        display: grid;
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 7px;
        background: #fff;
        color: var(--accent, var(--violet));
        font-size: 9px;
      }
      .goal p { margin: 2px 0 0; font-size: 11px; font-weight: 700; line-height: 1.48; }
      .steps { display: grid; gap: 10px; }
      .step {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #edf0f5;
        padding: 0 0 10px;
      }
      .step:last-child { border-bottom: 0; padding-bottom: 0; }
      .step > b {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        border-radius: 9px;
        background: var(--soft, var(--violet-soft));
        color: var(--accent, var(--violet));
        font-size: 9px;
      }
      .step strong { display: block; margin-bottom: 4px; font-size: 12px; }
      .step p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
      .step em { color: var(--muted); font-size: 9px; font-style: normal; font-weight: 700; }
      .question {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 13px;
        border-bottom: 1px solid #e9edf4;
        padding: 12px 0;
      }
      .question:first-child { padding-top: 0; }
      .question:last-child { border-bottom: 0; padding-bottom: 0; }
      .question > b {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 9px;
        background: var(--soft, var(--violet-soft));
        color: var(--accent, var(--violet));
        font-size: 10px;
      }
      .question p { margin: 0 0 9px; font-size: 12px; font-weight: 700; line-height: 1.5; }
      .answers { display: flex; flex-wrap: wrap; gap: 7px; }
      .answers span {
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 6px 9px;
        font-size: 9px;
        font-weight: 700;
      }
      .motion-graph {
        display: block;
        width: 100%;
        height: 104px;
        margin: 2px 0 9px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background:
          linear-gradient(rgba(60,75,104,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(60,75,104,.045) 1px, transparent 1px),
          #fbfdfd;
        background-size: 20px 20px;
      }
      .motion-graph .axis {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.8;
      }
      .motion-graph .guide {
        fill: none;
        stroke: #aeb9c9;
        stroke-dasharray: 4 4;
        stroke-width: 1;
      }
      .motion-graph .motion-line {
        fill: none;
        stroke: var(--accent, var(--cyan));
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 4;
      }
      .motion-graph circle {
        fill: #fff;
        stroke: var(--accent, var(--cyan));
        stroke-width: 2.5;
      }
      .motion-graph text {
        fill: var(--muted);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        font-weight: 700;
      }
      .motion-graph .point-label { fill: var(--ink); font-size: 10px; font-weight: 900; }
      .formula {
        border-left: 4px solid var(--accent, var(--violet));
        border-radius: 0 13px 13px 0;
        background: var(--soft, var(--violet-soft));
        padding: 15px 18px;
      }
      .formula strong {
        display: block;
        margin-bottom: 6px;
        color: var(--accent, var(--violet));
        font-size: 25px;
        letter-spacing: .02em;
      }
      .formula p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
      .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
      .task {
        min-height: 105px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .task span {
        color: var(--accent, var(--violet));
        font-size: 8px;
        font-weight: 900;
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .task h3 { margin: 9px 0 7px; font-size: 13px; }
      .task p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
      .task .equation {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
      }
      .locked {
        position: relative;
        min-height: 105px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fafbfe;
        padding: 16px;
      }
      .locked-lines { filter: blur(5px); opacity: .34; }
      .locked-lines i {
        display: block;
        height: 8px;
        margin-bottom: 12px;
        border-radius: 99px;
        background: #7f8aa0;
      }
      .locked-lines i:nth-child(2) { width: 86%; }
      .locked-lines i:nth-child(3) { width: 74%; }
      .locked-cover {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        background: rgba(255,255,255,.62);
        text-align: center;
        backdrop-filter: blur(2px);
      }
      .locked-cover b {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        margin: 0 auto 11px;
        border-radius: 50%;
        background: var(--accent, var(--violet));
        color: #fff;
        font-size: 15px;
      }
      .locked-cover strong { font-size: 13px; }
      .locked-cover small { margin-top: 5px; color: var(--muted); font-size: 9px; }
      .circuit {
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 18px;
      }
      .circuit-diagram {
        position: relative;
        min-height: 190px;
        border-radius: 16px;
        background:
          linear-gradient(rgba(60,75,104,.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(60,75,104,.055) 1px, transparent 1px),
          var(--soft, var(--cyan-soft));
        background-size: 22px 22px;
      }
      .circuit-svg { display: block; width: 100%; height: 190px; }
      .circuit-svg .circuit-line {
        fill: none;
        stroke: var(--accent, var(--cyan));
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3.5;
      }
      .circuit-svg .device-ring {
        fill: #fff;
        stroke: var(--accent, var(--cyan));
        stroke-width: 3.5;
      }
      .circuit-svg .resistor {
        fill: #fff;
        stroke: var(--accent, var(--cyan));
        stroke-width: 3;
      }
      .circuit-svg .node { fill: var(--accent, var(--cyan)); }
      .circuit-svg text {
        fill: var(--accent, var(--cyan));
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 900;
      }
      .circuit-svg .source-label { fill: var(--muted); font-size: 8px; }
      .safety { display: grid; gap: 9px; }
      .safety div {
        display: flex;
        gap: 9px;
        border-radius: 10px;
        background: var(--soft, var(--cyan-soft));
        padding: 10px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        line-height: 1.45;
      }
      .safety b { color: var(--accent, var(--cyan)); }
      .table {
        display: grid;
        grid-template-columns: 1.3fr repeat(3, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .table div {
        min-height: 45px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 13px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
      }
      .table div:nth-child(4n) { border-right: 0; }
      .table div:nth-last-child(-n+4) { border-bottom: 0; }
      .table .head { background: var(--soft, var(--cyan-soft)); color: var(--ink); }
      .graph-box {
        position: relative;
        height: 170px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background:
          linear-gradient(rgba(60,75,104,.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(60,75,104,.07) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .graph-box::before, .graph-box::after {
        position: absolute;
        background: var(--ink);
        content: "";
      }
      .graph-box::before { right: 30px; bottom: 28px; left: 34px; height: 2px; }
      .graph-box::after { top: 24px; bottom: 28px; left: 34px; width: 2px; }
      .graph-axis-label {
        position: absolute;
        z-index: 2;
        border-radius: 5px;
        background: rgba(255,255,255,.84);
        color: var(--ink);
        padding: 3px 5px;
        font-size: 10px;
        font-weight: 900;
      }
      .graph-axis-label.y { top: 8px; left: 8px; }
      .graph-axis-label.x { right: 10px; bottom: 6px; }
      .graph-origin {
        position: absolute;
        bottom: 12px;
        left: 21px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
      }
      .page-worksheet-2 .section { margin-top: 18px; padding: 16px 20px; }
      .page-worksheet-2 .section-title { margin-bottom: 14px; }
      .page-worksheet-2 .graph-box { height: 145px; }
      .page-worksheet-2 .question { padding: 8px 0; }
      .page-worksheet-2 .locked { min-height: 82px; }
      .page-worksheet-2 .locked-cover b {
        width: 30px;
        height: 30px;
        margin-bottom: 5px;
        font-size: 12px;
      }
      footer {
        position: absolute;
        right: 66px;
        bottom: 45px;
        left: 66px;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 16px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: .055em;
      }
      footer strong {
        color: var(--accent, var(--violet));
        letter-spacing: .11em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <script>
      const query = new URLSearchParams(location.search)
      const doc = query.get('doc') || 'guide'
      const pageNumber = Number(query.get('page') || 1)

      const data = {

        diagnostic: {
